services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - clio-data:/data
    environment:
      - SQLITE_PATH=/data/clio.db
      - CHROMA_PATH=/data/chroma
      - COW_DATA_DIR=/data/cow

  frontend:
    build: ./frontend
    ports:
      - "4173:4173"
    depends_on:
      - api

volumes:
  clio-data:
